name: Create GitHub release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, in vX.Y.Z form
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: "release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
      GH_TOKEN: "${{ github.token }}"
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: "${{ env.RELEASE_TAG }}"

      - name: Verify tag and skill version
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must use vX.Y.Z"
            exit 1
          fi

          version="$(sed -n 's/^  version: "\([^"]*\)"$/\1/p' SKILL.md)"
          if [ -z "$version" ]; then
            echo "::error::SKILL.md is missing metadata.version"
            exit 1
          fi

          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::tag $RELEASE_TAG does not match SKILL.md version $version"
            exit 1
          fi

      - name: Create release if missing
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG already exists"
            exit 0
          fi

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --generate-notes
